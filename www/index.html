<!doctype html>
<html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0A192F"><meta name="color-scheme" content="light"><title>ဆိုင် POS</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>:root{color-scheme:light}[hidden]:not([hidden=until-found i]){display:none!important}img{max-width:100%}</style>
<style>
/* Layout: iOS-style app shell. Sticky glass header, floating glass tab bar, content in cards and tables.
   Palette: pure white + deep navy only. Paid = soft tint pill with check, Unpaid = solid navy pill. */
:root{
  --ink:#0A192F; --royal:#1E3A8A; --paper:#FFFFFF;
  --bg:#FFFFFF; --fg:#0A192F;
  --mut:rgba(10,25,47,.62); --faint:rgba(10,25,47,.40);
  --line:rgba(10,25,47,.10); --tint:rgba(10,25,47,.045); --tint2:rgba(30,58,138,.09);
  --card:#FFFFFF; --pri:#1E3A8A; --pri-fg:#FFFFFF; --act:#1E3A8A;
  --glass:rgba(255,255,255,.76); --scrim:rgba(10,25,47,.40);
  --shadow:0 1px 2px rgba(10,25,47,.05),0 10px 30px rgba(10,25,47,.07);
  --font:"Plus Jakarta Sans","Noto Sans Myanmar","Myanmar Text","Padauk",system-ui,sans-serif;
  --tabh:66px;
  --tab-bg:#0A192F; --tab-fg:rgba(255,255,255,.56); --tab-act:#FFFFFF; --tab-pill:rgba(255,255,255,.15);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:400 15px/1.7 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
.num,.tnum{font-variant-numeric:tabular-nums}
.ic{width:22px;height:22px;flex:none}
.ic.s{width:14px;height:14px}
.mut{color:var(--mut)} .sm{font-size:13px}
:focus-visible{outline:2px solid var(--act);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:70;background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid var(--line)}
.top-in,.view{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px}
.ttl{min-width:0}
.shop{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.6}
h1{font-size:23px;font-weight:800;line-height:1.5;letter-spacing:-.01em;text-wrap:balance}
.top-r{display:flex;align-items:center;gap:8px;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--tint);border-radius:999px;padding:2px 10px;font-size:11.5px;line-height:1.7;color:var(--mut);max-width:150px}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--fg);flex:none}
.chip.local i{background:transparent;border:1.5px solid var(--fg)}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:var(--tint);display:grid;place-items:center;transition:transform .15s,background .2s}
.icon-btn:active{transform:scale(.92)}
.view{padding-block:12px 190px;display:block}

/* motion */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
.icon-btn.spin svg{animation:spin .8s linear infinite}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:50ms}.enter>*:nth-child(3){animation-delay:100ms}.enter>*:nth-child(4){animation-delay:150ms}
.enter>*:nth-child(5){animation-delay:200ms}.enter>*:nth-child(n+6){animation-delay:250ms}
.enter .bar-fill{animation:grow .7s cubic-bezier(.2,.8,.2,1) both;transform-origin:bottom}
.skel{height:84px;border-radius:22px;background:linear-gradient(100deg,var(--tint) 30%,var(--tint2) 50%,var(--tint) 70%);background-size:200% 100%;animation:shimmer 1.4s linear infinite;margin-bottom:14px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-h h3{font-size:16px;font-weight:700;line-height:1.5}
.hero{background:linear-gradient(145deg,#0A192F 0%,#1E3A8A 100%);color:#fff;border-radius:26px;padding:20px;margin-bottom:14px;box-shadow:0 14px 34px rgba(10,25,47,.28);border:1px solid rgba(255,255,255,.12)}
.hero .eb{font-size:13px;opacity:.78}
.hero .big{font:800 38px/1.3 var(--font);letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.hero .big small{font-size:15px;font-weight:600;opacity:.8;margin-left:6px}
.hero .sub{font-size:13px;opacity:.82;margin-top:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:14px 16px;min-width:0}
.tile .eb{font-size:12.5px;color:var(--mut)}
.tile .v{font:800 22px/1.4 var(--font);font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow-wrap:anywhere}
.tile .v small{font-size:12px;font-weight:600;color:var(--mut);margin-left:4px}
.banner{display:flex;gap:12px;align-items:flex-start;background:var(--tint2);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:14px}
.banner .b-t{font-weight:700;line-height:1.55}
.banner .b-v{font:800 20px/1.5 var(--font);font-variant-numeric:tabular-nums}
.banner > div{min-width:0;flex:1}

/* buttons / forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:6px 18px;border-radius:14px;border:0;font-weight:600;font-size:15px;line-height:1.5;background:var(--tint);color:var(--fg);transition:transform .15s,opacity .2s,background .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--pri);color:var(--pri-fg)}
.btn.out{background:transparent;border:1.5px solid var(--fg)}
.btn.block{width:100%}
.btn.s{min-height:36px;padding:2px 14px;font-size:13.5px;border-radius:12px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn .ic{width:18px;height:18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rowf{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.lbl{font-size:13px;font-weight:600;color:var(--mut)}
.inp{width:100%;min-height:46px;padding:8px 14px;border-radius:14px;border:1.5px solid transparent;background:var(--tint);outline:0;transition:border-color .2s,background .2s}
.inp:focus{border-color:var(--act);background:var(--card)}
.inp[disabled]{opacity:.6}
.search{position:relative}
.search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint);width:18px;height:18px}
.search .inp{padding-left:40px}
.seg{display:flex;gap:2px;background:var(--tint);border-radius:13px;padding:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;min-height:36px;padding:2px 8px;font-size:13.5px;font-weight:600;color:var(--mut);transition:background .2s,color .2s,box-shadow .2s}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 4px rgba(10,25,47,.16)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:1px 11px;font-size:12px;font-weight:700;line-height:1.8;white-space:nowrap}
.pill.paid{background:var(--tint2);color:var(--fg)}
.pill.unpaid{background:var(--pri);color:var(--pri-fg)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.tag{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:0 7px;font-size:11px;color:var(--mut);line-height:1.7;margin-top:2px}
.stock{display:inline-block;min-width:34px;text-align:center;border-radius:9px;padding:0 8px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--tint)}
.stock.low{background:transparent;border:1.5px solid var(--fg)}
.stock.out{background:var(--pri);color:var(--pri-fg)}

/* tables */
.tbl-wrap{border:1px solid var(--line);border-radius:16px;overflow:auto;background:var(--card)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;font-weight:600;color:var(--mut);text-align:left;padding:9px 10px;background:var(--tint);white-space:nowrap}
.tbl td{padding:10px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tbody tr[data-act]{cursor:pointer;transition:background .15s}
.tbl tbody tr[data-act]:active,.tbl tbody tr[data-act]:hover{background:var(--tint)}
.tbl .r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl .c,.tbl th.c{text-align:center}
.tbl tfoot td{font-weight:800;background:var(--tint)}
.nm{font-weight:600;line-height:1.5;overflow-wrap:anywhere}
.sub{font-size:12px;color:var(--mut);line-height:1.5}
.sub-price{display:none}
.stepper{display:inline-flex;align-items:center;background:var(--tint);border-radius:11px}
.stepper button{width:30px;height:32px;border:0;background:transparent;font-size:18px;line-height:1;border-radius:11px}
.stepper input{width:36px;text-align:center;border:0;background:transparent;font-weight:700;padding:0;outline:0;font-variant-numeric:tabular-nums}
.x-btn{border:0;background:transparent;color:var(--faint);padding:2px;display:inline-grid;place-items:center;vertical-align:middle}
@media (max-width:540px){.col-price{display:none}.sub-price{display:block}}

/* sell */
.sell{display:grid;gap:14px}
.sell>section{min-width:0}
.prods{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-height:340px;overflow:auto;padding:2px;margin-top:12px}
.prod{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:10px 12px;min-width:0;transition:transform .15s,border-color .2s}
.prod:active{transform:scale(.96)}
.prod:hover{border-color:var(--act)}
.prod[disabled]{opacity:.45}
.prod .pn{font-weight:600;line-height:1.5;overflow-wrap:anywhere}
.prod .pp{font:700 14px/1.5 var(--font);font-variant-numeric:tabular-nums}
.prod .ps{font-size:11.5px;color:var(--mut)}
.prod.added{animation:pop .3s}
@media (min-width:900px){.sell{grid-template-columns:1.05fr 1fr;align-items:start}.prods{max-height:none;grid-template-columns:repeat(3,1fr)}.prods-card{position:static}}
.cobar{position:fixed;z-index:55;left:0;right:0;bottom:calc(var(--tabh) + 12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.cobar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 18px;border-radius:20px;background:var(--pri);color:var(--pri-fg);box-shadow:0 12px 30px rgba(10,25,47,.35);pointer-events:auto;animation:rise .35s both}
.cobar-in .t{flex:1;min-width:0;line-height:1.4}
.cobar-in .t b{display:block;font:800 18px/1.4 var(--font);font-variant-numeric:tabular-nums}
.cobar-in .t span{font-size:12px;opacity:.8}
.cobar-in .btn{background:var(--pri-fg);color:var(--pri)}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line);cursor:pointer;min-width:0;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.li:first-child{border-top:0}
.li .mid{flex:1;min-width:0}
.li .end{text-align:right;flex:none;font-variant-numeric:tabular-nums}
.av{width:42px;height:42px;border-radius:50%;background:var(--tint2);display:grid;place-items:center;font-weight:800;flex:none}
.empty{text-align:center;color:var(--mut);padding:26px 12px}
.empty .ic{width:34px;height:34px;color:var(--faint);margin-bottom:6px}
.stat{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mut);margin:10px 2px}
.stat b{color:var(--fg)}

/* charts */
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.bar-v{font-size:10.5px;color:var(--mut);height:16px;white-space:nowrap}
.bar-track{height:116px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.bar-fill{width:70%;max-width:34px;border-radius:9px 9px 5px 5px;background:var(--tint2)}
.bar-col.now .bar-fill{background:var(--pri)}
.bar-l{font-size:12px;color:var(--mut)}
.bar-col.now .bar-l{color:var(--fg);font-weight:700}
.rank{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.rank:first-child{border-top:0}
.rk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--tint2);flex:none}
.rank:nth-child(1) .rk{background:var(--pri);color:var(--pri-fg)}
.meter{height:6px;border-radius:99px;background:var(--tint);margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--pri)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--tab-bg);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(10,25,47,.22);padding-top:7px;padding-bottom:calc(7px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabbar-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;padding:2px 0;color:var(--tab-fg);font-size:10.5px;line-height:1.5;white-space:nowrap;transition:color .2s}
.tab .pl{display:grid;place-items:center;width:48px;height:30px;border-radius:15px;transition:background .25s,transform .25s}
.tab[aria-current="page"]{color:var(--tab-act);font-weight:700}
.tab[aria-current="page"] .pl{background:var(--tab-pill);transform:scale(1.04)}
.tab:active .pl{transform:scale(.9)}

/* sheets */
.sheet-root{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .3s}
.sheet{position:relative;width:100%;max-width:640px;max-height:92%;display:flex;flex-direction:column;background:var(--bg);border-radius:26px 26px 0 0;box-shadow:0 -12px 50px rgba(10,25,47,.28);transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.9,.25,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-root.in .scrim{opacity:1}
.sheet-root.in .sheet{transform:none}
.grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 0;flex:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px max(18px,env(safe-area-inset-right,0px)) 6px max(18px,env(safe-area-inset-left,0px))}
.sheet-h h2{font-size:18px;font-weight:800;line-height:1.6;min-width:0;overflow-wrap:anywhere}
.sheet-b{overflow:auto;padding:6px max(18px,env(safe-area-inset-right,0px)) 18px max(18px,env(safe-area-inset-left,0px));flex:1;-webkit-overflow-scrolling:touch}
.sheet-f{padding:12px max(18px,env(safe-area-inset-right,0px)) 14px max(18px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);flex:none}
.sheet-root.small .sheet{border-radius:26px;max-width:380px;margin:auto 16px;max-height:80%;transform:scale(.94);opacity:0;transition:transform .3s cubic-bezier(.2,.9,.25,1),opacity .25s}
.sheet-root.small{align-items:center}
.sheet-root.small.in .sheet{transform:none;opacity:1}
.sheet-root.small .grab{display:none}
@media (min-width:700px){.sheet-root{align-items:center}.sheet{border-radius:26px;transform:translateY(24px) scale(.97);opacity:0;transition:transform .35s cubic-bezier(.2,.9,.25,1),opacity .25s}.sheet-root.in .sheet{opacity:1}.grab{display:none}}
.msg{padding:6px 0 4px;line-height:1.8}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:14px;margin:8px 0 12px}
.kv dt{color:var(--mut)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sumbox{background:var(--tint);border-radius:16px;padding:12px 14px}
.sumbox .ln{display:flex;justify-content:space-between;gap:10px;padding:2px 0;font-variant-numeric:tabular-nums}
.sumbox .ln.g{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:800;font-size:17px}
.reslist{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.res{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:6px 12px;text-align:left;min-width:0}
.res .mid{flex:1;min-width:0}
.selchip{display:flex;align-items:center;gap:10px;background:var(--tint2);border-radius:14px;padding:8px 12px}
.selchip .mid{flex:1;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec-t{font-size:14px;font-weight:700;margin:16px 0 8px}
.prev{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;position:relative;margin:8px 0 12px}
.prev-in{transform-origin:top left;width:max-content;padding:10px}
.prev.edt [data-ed]{cursor:pointer;outline:1px dashed rgba(10,25,47,.3);outline-offset:2px;border-radius:3px}
.prev.edt [data-ed].sel{outline:2px solid #0A192F;background:rgba(10,25,47,.07)}
.edp{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:12px;margin:0 0 14px}
.edp input[type=range]{width:100%;accent-color:var(--pri);margin:4px 0}
.edp .rw{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13.5px}
.edp .btn[aria-pressed="true"]{background:var(--pri);color:var(--pri-fg)}
.vtabs{margin-bottom:12px}.vtabs button{display:inline-flex;align-items:center;justify-content:center;gap:6px}

.mpick{display:flex;flex-wrap:wrap;gap:8px}
.mchip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:2px 14px;font-weight:600;font-size:13.5px;min-height:36px;display:inline-flex;align-items:center;gap:6px;line-height:1.5;transition:transform .15s,background .2s}
.mchip:active{transform:scale(.95)}
.mchip[aria-pressed="true"]{background:var(--pri);color:var(--pri-fg);border-color:var(--pri)}
.mchip.add{border-style:dashed;color:var(--mut)}
.mchip.fixed{background:var(--tint2);border-color:transparent}
.mtag{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:0 7px;font-size:11.5px;font-weight:600;line-height:1.7;white-space:nowrap}
a.btn{text-decoration:none}
.tap{cursor:pointer;transition:transform .15s}
.tap:active{transform:scale(.98)}
.tile.tap{display:block;width:100%;font:inherit;color:inherit;text-align:left}
.flip{transform:scaleX(-1)}
/* print area (on-screen hidden; shown only when printing) */
#printArea{display:none}
@media print{
  html,body{background:#fff!important}
  body::before{display:none}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
}
:root{--red:#B91C1C;--redbg:rgba(185,28,28,.09)}
.w{color:var(--red)!important}
.pill.unpaid{background:var(--redbg);color:var(--red)}
.tag{color:var(--red);border-color:rgba(185,28,28,.3)}
.banner{background:var(--redbg);border-color:rgba(185,28,28,.25)}.banner .b-t,.banner .b-v{color:var(--red)}
.stock.low{border-color:var(--red);color:var(--red)}.stock.out{background:var(--red);color:#fff}
.chip.w{border-color:rgba(185,28,28,.4)}

const DEFAULTS={methods:['ငွေသား','KPay','Wave Pay'],shopName:'ကျွန်ုပ်၏ဆိုင်',phone:'',address:'',footer:'ဝယ်ယူအားပေးမှုအတွက် ကျေးဇူးတင်ပါသည်။',earnPer:1000,pointValue:10,logo:'',logoSize:'m',headerNote:'',vTitle:'ဘောက်ချာ',signBox:true,inviteCode:'',expCats:['ကုန်ပစ္စည်း ဝယ်ယူမှု','ဝန်ထမ်းလစာ','ဆိုင်ခန်းလခ','မီး / ရေ / အင်တာနက်','ပို့ဆောင်ခ','အခြား']};
const LS_KEY='shoppos.v1';
/* ---- Local database (IndexedDB, falls back to localStorage) ---- */
const Idb={
  db:null,
  open(){return new Promise((res,rej)=>{
    if(this.db)return res(this.db);
    let r;try{r=indexedDB.open('shoppos',1)}catch(e){return rej(e)}
    r.onupgradeneeded=()=>{try{r.result.createObjectStore('kv')}catch(e){}};
    r.onsuccess=()=>{this.db=r.result;this.db.onclose=()=>{this.db=null};res(this.db)};
    r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('idb blocked'));
  })},
  async get(k){
    try{const db=await this.open();return await new Promise((res,rej)=>{const q=db.transaction('kv','readonly').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
    catch(e){try{const s=localStorage.getItem('idbfb:'+k);return s?JSON.parse(s):undefined}catch(x){return undefined}}
  },
  async set(k,v){
    try{const db=await this.open();await new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('idb abort'))})}
    catch(e){console.error(e);localStorage.setItem('idbfb:'+k,JSON.stringify(v))}
  }
};
const isNetErr=e=>{
  const m=String((e&&(e.message||e.error_description))||e||''),c=String((e&&e.code)||'');
  if(typeof navigator!=='undefined'&&navigator.onLine===false)return true;
  return /failed to fetch|networkerror|network request failed|load failed|fetch failed|timeout|timed out|abort|internet|ERR_/i.test(m)||(!c&&/fetch|network/i.test(m))||m==='lib';
};
const Store={
  mode:'local',db:null,dl:null,d:{products:{},customers:{},vouchers:{},expenses:{},accounts:{},closings:{},settings:Object.assign({},DEFAULTS)},
  subs:[],ready:{},ch:null,failed:false,
  ob:{},obN:0,          /* outbox: changes made on this phone that Supabase has not received yet */
  pk:'',cfg:null,synced:false,lastSync:0,
  online:true,syncErr:'',run:null,again:false,started:false,persistT:null,syncT:null,hadPending:false,
  on(f){this.subs.push(f)},
  emit(){this.subs.forEach(f=>{try{f()}catch(e){console.error(e)}})},
  list(c){return Object.values(this.d[c])},
  get(c,id){return this.d[c][id]},
  pendingCount(){return Object.keys(this.ob).length},
  async init(){
    const use=async n=>{try{if(window.claude&&typeof window.claude.use==='function')return await window.claude.use(n)}catch(e){}return null};
    this.dl=(await use('downloads'))||Dl;
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
    let cfg=Sb.cfg(),err='';
    for(;;){
      if(!cfg||(!cfg.local&&(!cfg.url||!cfg.key))){cfg=await Sb.setup(err);err=''}
      if(cfg.local){this.mode='local';this.pk='state:local';await this.loadCache();this.watchPage();return}
      this.cfg=cfg;this.pk='state:'+cfg.url;
      const had=await this.loadCache();
      this.mode='cloud';
      if(had){
        /* works immediately from the data stored on this phone - online or not */
        COLLS.forEach(c=>{this.ready[c]=1});
        this.start();return;
      }
      /* first run on this phone: needs internet once to download the shop data */
      try{
        await Sb.connect(cfg);
        const all=await this.loadAll();this.apply(all);
        this.synced=true;this.lastSync=Date.now();this.persist();
        this.start();return;
      }catch(e){
        console.error(e);this.db=null;this.mode='local';
        err=isNetErr(e)?'ပထမဆုံးအကြိမ် အင်တာနက် လိုအပ်ပါသည် — အင်တာနက်ချိတ်ပြီး ထပ်ကြိုးစားပါ။ ('+Sb.explain(e)+')':Sb.explain(e);cfg=null;
      }
    }
  },
  async loadCache(){
    let s=null;
    try{s=await Idb.get(this.pk)}catch(e){console.error(e)}
    if(!s&&this.pk==='state:local'){
      /* data saved by the older single-file version */
      try{const raw=localStorage.getItem(LS_KEY);if(raw)s={d:JSON.parse(raw),ob:{},synced:false}}catch(e){}
    }
    if(!s||!s.d)return false;
    COLLS.forEach(c=>{this.d[c]=s.d[c]||{}});
    this.d.settings=Object.assign({},DEFAULTS,s.d.settings||{});
    this.ob=s.ob||{};this.obN=Object.values(this.ob).reduce((a,o)=>Math.max(a,o.n||0),0);
    this.lastSync=s.lastSync||0;this.synced=!!s.synced;
    return this.synced;
  },
  persist(){clearTimeout(this.persistT);this.persistT=setTimeout(()=>this.persistNow(),60)},
  async persistNow(){
    clearTimeout(this.persistT);
    if(!this.pk)return;
    try{
      await Idb.set(this.pk,{d:this.d,ob:this.ob,synced:this.synced,lastSync:this.lastSync});
      if(this.failed){this.failed=false;paintChrome()}
    }catch(e){this.failed=true;console.error(e);paintChrome();toast('ဖုန်းထဲတွင် သိမ်း၍ မရပါ — နေရာ ပြည့်နေနိုင်သည်')}
  },
  async client(){
    if(this.db)return this.db;
    await Sb.lib();
    const to=(u,o)=>{o=o||{};if(o.signal)return fetch(u,o);const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),25000);return fetch(u,Object.assign({},o,{signal:ctl.signal})).finally(()=>clearTimeout(t))};
    this.db=window.supabase.createClient(this.cfg.url,this.cfg.key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false},global:{fetch:to}});
    return this.db;
  },
  async loadAll(){
    const db=await this.client();
    const m={};COLLS.forEach(c=>{m[c]={}});let settings=null;
    for(let from=0;;from+=1000){
      const r=await db.from('kv').select('collection,id,data').order('collection').order('id').range(from,from+999);
      if(r.error)throw r.error;
      (r.data||[]).forEach(x=>{
        if(x.collection==='meta'){if(x.id==='settings')settings=x.data}
        else if(m[x.collection])m[x.collection][x.id]=Object.assign({},x.data,{id:x.id});
      });
      if(!r.data||r.data.length<1000)break;
    }
    return {m:m,settings:settings};
  },
  /* put what is waiting in the outbox on top of freshly downloaded data, so unsent work is never overwritten */
  overlay(){
    Object.values(this.ob).forEach(o=>{
      if(o.c==='meta'){if(o.id==='settings'&&o.op==='put')this.d.settings=Object.assign({},DEFAULTS,o.data);return}
      if(!this.d[o.c])return;
      if(o.op==='del')delete this.d[o.c][o.id];else this.d[o.c][o.id]=Object.assign({},o.data,{id:o.id});
    });
  },
  apply(all){
    COLLS.forEach(c=>{this.d[c]=all.m[c];this.ready[c]=1});
    if(all.settings)this.d.settings=Object.assign({},DEFAULTS,all.settings);
    this.overlay();
  },
  async flush(db){
    const ents=Object.values(this.ob).sort((a,b)=>a.n-b.n);
    if(!ents.length)return;
    const done=e=>{const k=e.c+'/'+e.id,cur=this.ob[k];if(cur&&cur.n===e.n)delete this.ob[k]};
    const puts=ents.filter(e=>e.op==='put');
    for(let i=0;i<puts.length;i+=100){
      const ch=puts.slice(i,i+100),now=new Date().toISOString();
      const r=await db.from('kv').upsert(ch.map(e=>({collection:e.c,id:e.id,data:e.data,updated_at:now})));
      if(r.error)throw r.error;
      ch.forEach(done);this.persist();
    }
    for(const e of ents.filter(e=>e.op==='del')){
      const r=await db.from('kv').delete().eq('collection',e.c).eq('id',e.id);
      if(r.error)throw r.error;
      done(e);this.persist();
    }
  },
  /* upload what is waiting, then download everything new. Safe to call at any time. */
  sync(){
    if(this.mode!=='cloud')return Promise.resolve(false);
    if(this.run){this.again=true;return this.run}
    const had=this.pendingCount()>0;
    this.run=(async()=>{
      paintChrome();
      try{
        do{
          this.again=false;
          const db=await this.client();
          await this.flush(db);
          const all=await this.loadAll();
          const before=JSON.stringify([COLLS.map(c=>this.d[c]),this.d.settings]);
          this.apply(all);
          this.synced=true;this.lastSync=Date.now();this.persist();
          if(JSON.stringify([COLLS.map(c=>this.d[c]),this.d.settings])!==before)this.emit();
          if(!this.ch)this.listen();
        }while(this.again);
        const wasOff=!this.online||this.syncErr;
        this.online=true;this.syncErr='';
        if(wasOff&&(had||this.hadPending)){toast('အင်တာနက် ပြန်ရပြီ — ဒေတာ ချိန်ညှိပြီးပါပြီ')}
        this.hadPending=false;
      }catch(e){
        if(isNetErr(e)){this.online=false;this.syncErr=''}
        else{this.online=true;this.syncErr=Sb.explain(e);console.error(e)}
        if(this.pendingCount())this.hadPending=true;
      }finally{this.run=null;paintChrome()}
      return this.online&&!this.syncErr;
    })();
    return this.run;
  },
  kick(){clearTimeout(this.syncT);this.syncT=setTimeout(()=>this.sync(),400)},
  /* auto refresh: runs whenever internet comes back, the app is reopened, or on a timer */
  start(){
    if(this.started)return;this.started=true;
    this.watchPage();
    window.addEventListener('online',()=>{this.online=true;paintChrome();this.sync()});
    window.addEventListener('offline',()=>{this.online=false;paintChrome()});
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)this.sync()});
    setInterval(()=>{
      if(this.run)return;
      if(this.pendingCount()>0||!this.online||this.syncErr){this.sync();return}
      if(!document.hidden&&Date.now()-this.lastSync>45000)this.sync();
    },10000);
    paintChrome();
    this.sync();
  },
  watchPage(){
    const f=()=>{if(this.persistT)this.persistNow()};
    window.addEventListener('pagehide',f);
    document.addEventListener('visibilitychange',()=>{if(document.hidden)f()});
  },
  listen(){
    try{
      this.ch=this.db.channel('pos-kv').on('postgres_changes',{event:'*',schema:'public',table:'kv'},p=>this.onChange(p)).subscribe();
    }catch(e){console.error(e)}
  },
  onChange(p){
    const t=p.eventType,row=t==='DELETE'?p.old:p.new;
    if(!row||!row.collection||!row.id)return;
    const c=row.collection,id=row.id;
    if(this.ob[c+'/'+id])return;
    if(c==='meta'){if(id==='settings'&&t!=='DELETE'&&row.data){this.d.settings=Object.assign({},DEFAULTS,row.data);this.persist();this.emit()}return}
    if(!this.d[c])return;
    if(t==='DELETE')delete this.d[c][id];else if(row.data)this.d[c][id]=Object.assign({},row.data,{id:id});else return;
    this.persist();this.emit();
  },
  track(c,id,op,data){
    if(this.mode==='cloud'){
      this.ob[c+'/'+id]={c:c,id:id,op:op,data:data==null?null:JSON.parse(JSON.stringify(data)),n:++this.obN};
      paintChrome();
      if(this.online)this.kick();
    }
    this.persist();
  },
  put(c,obj){
    const clean=JSON.parse(JSON.stringify(obj));
    this.d[c][clean.id]=clean;this.emit();
    this.track(c,clean.id,'put',clean);
    return Promise.resolve();
  },
  del(c,id){
    delete this.d[c][id];this.emit();
    this.track(c,id,'del',null);
    return Promise.resolve();
  },
  putSettings(s){
    this.d.settings=JSON.parse(JSON.stringify(s));this.emit();
    this.track('meta','settings','put',this.d.settings);
    return Promise.resolve();
  }
};

/* ================= Selectors ================= */
const Sel={
  closing(d){return Store.get('closings',d)},
  isClosed(d){const c=Store.get('closings',d);return !!c&&(c.status==='closed'||c.status==='reopen')},
  vouchers(){return Store.list('vouchers').sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))},
  rem(v){return Math.max(0,(v.total||0)-(v.paid||0))},
  salesOn(d){return Store.list('vouchers').reduce((a,v)=>a+(v.date===d?v.total:0),0)},
  countOn(d){return Store.list('vouchers').filter(v=>v.date===d).length},
  collectedOn(d){let t=0;Store.list('vouchers').forEach(v=>(v.payments||[]).forEach(p=>{if(dstr(new Date(p.at))===d)t+=p.amount}));return t},
  outstanding(){return Store.list('vouchers').reduce((a,v)=>a+Sel.rem(v),0)},
  carried(d){return Store.list('vouchers').reduce((a,v)=>a+(v.date<d?Sel.rem(v):0),0)},
  carriedCount(d){return Store.list('vouchers').filter(v=>v.date<d&&Sel.rem(v)>0).length},
  unpaid(){return Store.list('vouchers').filter(v=>Sel.rem(v)>0).sort((a,b)=>a.date===b.date?(a.createdAt-b.createdAt):(a.date<b.date?-1:1))},
  custDue(id){return Store.list('vouchers').reduce((a,v)=>a+(v.customerId===id?Sel.rem(v):0),0)},
  custSpent(id){return Store.list('vouchers').reduce((a,v)=>a+(v.customerId===id?v.total:0),0)},
  lowStock(){return Store.list('products').filter(p=>(p.stock||0)<=(p.low==null?5:p.low)).sort((a,b)=>a.stock-b.stock)},
  cname(v){const c=v.customerId?Store.get('customers',v.customerId):null;return c?c.name:(v.customerName||'ဧည့်သည်')}
};

/* ================= Cart ================= */
const tierPrice=(p,q,force)=>{const ts=(p.tiers||[]).slice().sort((a,b)=>a.min-b.min);const t=ts.filter(x=>x.min<=q).pop();return t?t.price:(force&&ts.length?ts[0].price:p.price)};
const Cart={
  items:[],customerId:null,
  P(pid){const it=this.items.find(i=>i.pid===pid);return it&&it.custom?Object.assign({id:pid,stock:1e9},it.custom):Store.get('products',pid)},
  lines(){return this.items.map(i=>{const p=this.P(i.pid);if(!p)return null;const pr=tierPrice(p,i.qty,i.whole);return {p:p,qty:i.qty,price:pr,whole:pr!==p.price,forced:!!i.whole,hasTier:!!(p.tiers&&p.tiers.length),amount:pr*i.qty}}).filter(Boolean)},
  subtotal(){return this.lines().reduce((a,l)=>a+l.amount,0)},
  count(){return this.items.reduce((a,i)=>a+i.qty,0)},
  add(pid){
    const p=Store.get('products',pid);if(!p)return false;
    const it=this.items.find(i=>i.pid===pid);const q=(it?it.qty:0)+1;
    if(q>p.stock){toast('လက်ကျန် မလုံလောက်ပါ ('+p.name+' — '+p.stock+' ခုသာ ကျန်သည်)');return false}
    if(it)it.qty=q;else this.items.push({pid:pid,qty:1});return true;
  },
  set(pid,q){
    const p=this.P(pid);const it=this.items.find(i=>i.pid===pid);if(!it||!p)return;
    q=Math.floor(q);if(!(q>0)){this.items=this.items.filter(i=>i.pid!==pid);return}
    if(q>p.stock){q=p.stock;toast('လက်ကျန် '+p.stock+' ခုသာ ရှိပါသည်')}
    it.qty=q;
  },
  remove(pid){this.items=this.items.filter(i=>i.pid!==pid)},
  clear(){this.items=[];this.customerId=null}
};

/* ================= Business actions ================= */
function nextNo(date){
  const base=date.replace(/-/g,'').slice(2);
  const used=new Set(Store.list('vouchers').map(v=>v.no));
  let n=Store.list('vouchers').filter(v=>v.date===date).length+1,no;
  do{no=base+'-'+pad(n,3);n++}while(used.has(no));
  return no;
}
function createVoucher(o){
  const S=Store.d.settings,now=Date.now(),date=today();
  const items=o.lines.map(l=>({pid:l.p.id,name:l.p.name,unit:l.p.unit||'',price:l.price,cost:l.p.cost==null?null:l.p.cost,qty:l.qty}));
  const subtotal=items.reduce((a,i)=>a+i.price*i.qty,0);
  const discount=Math.min(Math.max(0,Math.round(o.discount)),subtotal);
  const cust=o.customerId?Store.get('customers',o.customerId):null;
  let pts=cust?Math.min(Math.max(0,Math.floor(o.pointsUsed)),cust.points||0):0;
  const maxPts=S.pointValue>0?Math.ceil((subtotal-discount)/S.pointValue):0;
  pts=Math.min(pts,maxPts);
  const pointsValue=Math.min(pts*S.pointValue,subtotal-discount);
  const total=subtotal-discount-pointsValue;
  const received=Math.min(Math.max(0,Math.round(o.received)),total);
  const earned=(cust&&S.earnPer>0)?Math.floor(received/S.earnPer):0;
  const v={id:uid('v'),no:nextNo(date),date:date,createdAt:now,customerId:cust?cust.id:null,customerName:cust?cust.name:'',
    items:items,subtotal:subtotal,discount:discount,pointsUsed:pts,pointsValue:pointsValue,total:total,paid:received,
    payments:received>0?[{at:now,amount:received,method:o.method||DEFAULT_METHOD,by:Auth.me?Auth.me.id:'',byName:Auth.me?Auth.me.name:''}]:[],pointsEarned:earned,by:Auth.me?Auth.me.id:'',byName:Auth.me?Auth.me.name:''};
  items.forEach(i=>{const p=Store.get('products',i.pid);if(p)Store.put('products',Object.assign({},p,{stock:Math.max(0,(p.stock||0)-i.qty)}))});
  if(cust)Store.put('customers',Object.assign({},cust,{points:Math.max(0,(cust.points||0)-pts+earned)}));
  Store.put('vouchers',v);
  return v;
}
function applyPayment(v,amount,method){
  amount=Math.min(Math.max(0,Math.round(amount)),Sel.rem(v));if(amount<=0)return 0;
  const nv=Object.assign({},v,{payments:(v.payments||[]).concat([{at:Date.now(),amount:amount,method:method||DEFAULT_METHOD,by:Auth.me?Auth.me.id:'',byName:Auth.me?Auth.me.name:''}]),paid:(v.paid||0)+amount});
  const S=Store.d.settings;
  if(v.customerId&&S.earnPer>0){
    const target=Math.floor(nv.paid/S.earnPer),delta=target-(v.pointsEarned||0);
    if(delta>0){nv.pointsEarned=target;const c=Store.get('customers',v.customerId);if(c)Store.put('customers',Object.assign({},c,{points:(c.points||0)+delta}))}
  }
  Store.put('vouchers',nv);return amount;
}
function payDebt(cid,amount,method){
  let left=Math.round(amount),applied=0;
  const list=Sel.unpaid().filter(v=>v.customerId===cid);
  for(const v of list){if(left<=0)break;const a=applyPayment(Store.get('vouchers',v.id),Math.min(left,Sel.rem(v)),method);left-=a;applied+=a}
  return applied;
}

/* ================= UI primitives ================= */
let toastT;
function toast(msg,w){const el=$('#toast');el.textContent=msg;if(w===undefined)w=/မရပါ|မလုံလောက်|ထည့်ပါ|ရွေးပါ|မတွေ့ပါ|ခုသာ|ကျန်ရှိသေး|မရှင်းရသေး|မှားနေ/.test(msg)&&(!/ပြီးပါပြီ/.test(msg)||/မရှင်းရသေး/.test(msg));el.style.background=w?'#B91C1C':'var(--pri)';el.style.opacity='1';el.style.transform='translate(-50%,0)';clearTimeout(toastT);toastT=setTimeout(()=>{el.style.opacity='0';el.style.transform='translate(-50%,16px)'},2800)}
const Sheet={stack:[],
  open(o){
    const root=document.createElement('div');root.className='sheet-root'+(o.small?' small':'');
    root.innerHTML='<div class="scrim"></div><section class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(o.title)+'"><div class="grab" aria-hidden="true"></div><header class="sheet-h"><h2>'+esc(o.title)+'</h2><button class="icon-btn" data-sx aria-label="ပိတ်မည်">'+ico('x')+'</button></header><div class="sheet-b">'+(o.body||'')+'</div>'+(o.footer?'<footer class="sheet-f">'+o.footer+'</footer>':'')+'</section>';
    document.body.appendChild(root);
    const ctl={el:root,body:root.querySelector('.sheet-b'),closed:false,
      setBody(h){ctl.body.innerHTML=h},
      close(){if(ctl.closed)return;ctl.closed=true;Sheet.stack=Sheet.stack.filter(x=>x!==ctl);document.body.classList.toggle('lock',Sheet.stack.length>0);root.classList.remove('in');setTimeout(()=>root.remove(),380);if(o.onClose)o.onClose()}};
    root.querySelector('.scrim').addEventListener('click',()=>ctl.close());
    root.querySelector('[data-sx]').addEventListener('click',()=>ctl.close());
    Sheet.stack.push(ctl);document.body.classList.add('lock');
    requestAnimationFrame(()=>requestAnimationFrame(()=>root.classList.add('in')));
    if(o.onMount)o.onMount(root,ctl);
    return ctl;

      for(let y=0;y<hh;y++)for(let xb=0;xb<wb;xb++){let b=0;for(let k=0;k<8;k++){const x=xb*8+k;b<<=1;if(x<w){const i=((y0+y)*w+x)*4,a=px[i+3]/255,g=(px[i]*.3+px[i+1]*.59+px[i+2]*.11)*a+255*(1-a);if(g<165)b|=1}}out.push(b)}
    }
    out.push(0x1B,0x64,0x04);if(this.cfg.cut)out.push(0x1D,0x56,0x42,0x00);
    return new Uint8Array(out);
  },
  /* HTML receipt -> canvas (vector scaled to printer dots) */
  async toCanvas(html){
    const dots=this.dots(),cssW=Math.round((dots/8)/25.4*96),k=dots/cssW;
    const host=document.createElement('div');host.style.cssText='position:fixed;left:-9999px;top:0;width:'+cssW+'px';
    host.innerHTML='<div xmlns="http://www.w3.org/1999/xhtml" class="prnroot" style="width:'+cssW+'px;background:#fff">'+html+'</div>';document.body.appendChild(host);
    const root=host.firstElementChild;
    const css=PRINT_CSS+'.rc-th{width:100%!important;margin:0!important;padding:0!important}.rc{font-size:12px}';
    let H;
    const st=document.createElement('style');st.textContent=css;host.insertBefore(st,root);
    H=Math.ceil(root.scrollHeight)+8;
    const xml=new XMLSerializer().serializeToString(root);
    host.remove();
    const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+cssW+'" height="'+H+'"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml"><style>'+css.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</style>'+xml+'</div></foreignObject></svg>';
    const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('ဘောက်ချာပုံ ပြုလုပ်၍ မရပါ'));img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)});
    const cv=document.createElement('canvas');cv.width=dots;cv.height=Math.round(H*k);
    const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,cv.width,cv.height);c.drawImage(img,0,0,dots,cv.height);
    return cv;
  },
  async printHTML(html){const cv=await this.toCanvas(html);await this.write(this.raster(cv))},
  async printVoucher(v){await this.printHTML(receiptHTML(v,'th'))},
  async test(){
    const S=Store.d.settings;
    await this.printHTML('<div class="rc rc-th"><div class="ctr shop">'+esc(S.shopName)+'</div><div class="ctr">Printer စမ်းသပ်ခြင်း</div><hr><div class="ln"><span>ဆန်ကောင်း (၁ ပြည်)</span><span>2,800</span></div><div class="ln"><span>ABC abc 0123456789</span><span>✓</span></div><hr><div class="ctr">'+this.cfg.width+'mm · '+this.dots()+' dots</div></div>');
  }
};

async function directPrint(v){
  if(!Prn.connected()){
    if(!(await Prn.restore())){printerSheet();toast('Printer အရင်ချိတ်ပါ');return}
  }
  try{await Prn.printVoucher(v);toast('Printer သို့ ပို့ပြီးပါပြီ')}catch(e){toast('ပရင့်၍ မရပါ — '+(e&&e.message||e))}
}
function fitPreview(box){
  const inner=box.firstElementChild;if(!inner)return;
  inner.style.transform='none';
  const w=inner.scrollWidth,avail=box.clientWidth;
  const s=Math.min(1,avail/w);
  inner.style.transform='scale('+s+')';
  box.style.height=Math.ceil(inner.scrollHeight*s)+'px';
}

  const sameC=()=>st.cust===(v0.customerId||'');

  const sumHTML=()=>{const c=calc(),rem=c.total-c.paid;return '<div class="ln"><span>ကုန်ပစ္စည်း စုစုပေါင်း</span><span>'+ks(c.sub)+'</span></div>'+(c.disc>0?'<div class="ln"><span>လျှော့စျေး</span><span>- '+ks(c.disc)+'</span></div>':'')+(c.pv>0?'<div class="ln"><span>အမှတ်ဖြင့် နှုတ်ငွေ</span><span>- '+ks(c.pv)+'</span></div>':'')+'<div class="ln g"><span>ပေးရန် စုစုပေါင်း</span><span>'+ks(c.total)+'</span></div><div class="ln"><span>ပေးငွေ</span><span>'+ks(c.paid)+'</span></div><div class="ln"><span>ကျန်ငွေ</span><span><b'+(rem<0?' class="w"':'')+'>'+ks(rem)+'</b></span></div>'};
  const draw=()=>'<div class="two"><div class="field"><label class="lbl" for="veDate">ရက်စွဲ</label><input class="inp" id="veDate" type="date" max="'+today()+'" value="'+st.date+'"'+(Auth.owner()?'':' disabled')+'></div><div class="field"><label class="lbl" for="veCust">ဖောက်သည်</label><select class="inp" id="veCust"><option value="">ဧည့်သည်</option>'+custs.map(c=>'<option value="'+c.id+'"'+(c.id===st.cust?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></div></div>'
    +'<div class="sec-t">ပစ္စည်းများ</div>'+st.items.map((i,k)=>'<div class="ve-it"><div class="rowf" style="flex-wrap:nowrap"><input class="inp" data-i="'+k+'" data-f="name" value="'+esc(i.name)+'" aria-label="ပစ္စည်းအမည်" style="flex:1;min-width:0"><button type="button" class="icon-btn" data-irm="'+k+'" aria-label="ဖျက်မည်">'+ico('trash')+'</button></div><div class="two" style="margin-top:6px"><input class="inp" inputmode="numeric" data-i="'+k+'" data-f="price" value="'+i.price+'" aria-label="ဈေးနှုန်း" placeholder="ဈေးနှုန်း"><input class="inp" inputmode="numeric" data-i="'+k+'" data-f="qty" value="'+i.qty+'" aria-label="အရေအတွက်" placeholder="အရေအတွက်"></div></div>').join('')
    +'<div class="field" style="margin-top:10px"><label class="lbl" for="veDisc">လျှော့စျေး (ကျပ်)</label><input class="inp" id="veDisc" inputmode="numeric" value="'+(st.disc||'')+'" placeholder="0"></div>'
    +(st.pays.length?'<div class="sec-t">ငွေပေးချေမှု မှတ်တမ်း</div>'+st.pays.map((p,k)=>{const opts=ms.indexOf(p.method)<0&&p.method?ms.concat([p.method]):ms;return '<div class="rowf" style="flex-wrap:nowrap;margin-bottom:6px"><input class="inp" inputmode="numeric" data-p="'+k+'" data-f="amount" value="'+p.amount+'" aria-label="ပမာဏ" style="flex:1;min-width:0"><select class="inp" data-p="'+k+'" data-f="method" aria-label="နည်းလမ်း" style="flex:1;min-width:0">'+opts.map(m=>'<option'+(m===(p.method||DEFAULT_METHOD)?' selected':'')+'>'+esc(m)+'</option>').join('')+'</select><button type="button" class="icon-btn" data-prm="'+k+'" aria-label="ဖျက်မည်">'+ico('trash')+'</button></div>'}).join(''):'')
    +'<div class="sumbox" id="veSum" style="margin-top:12px">'+sumHTML()+'</div>';
  Sheet.open({title:'ဘောက်ချာ ပြင်မည် #'+v0.no,body:draw(),footer:'<button class="btn pri block" id="veSave">သိမ်းမည်</button>',
    onMount(el,ctl){
      const paintSum=()=>{el.querySelector('#veSum').innerHTML=sumHTML()};
      const onIn=e=>{const t=e.target;
        if(t.dataset.i!=null){const i=st.items[Number(t.dataset.i)],f=t.dataset.f;i[f]=f==='name'?t.value:f==='qty'?Math.max(0,Math.floor(num(t.value))):Math.max(0,Math.round(num(t.value)));paintSum()}
        else if(t.dataset.p!=null){const p=st.pays[Number(t.dataset.p)],f=t.dataset.f;p[f]=f==='amount'?Math.max(0,Math.round(num(t.value))):t.value;paintSum()}
        else if(t.id==='veDisc'){st.disc=t.value;paintSum()}
        else if(t.id==='veDate'){if(t.value)st.date=t.value}
        else if(t.id==='veCust'){st.cust=t.value;paintSum()}
      };
      el.addEventListener('input',onIn);el.addEventListener('change',onIn);
      el.addEventListener('click',e=>{
        const r=e.target.closest('[data-irm]'),pr=e.target.closest('[data-prm]');
        if(r){if(st.items.length<2){toast('ပစ္စည်း အနည်းဆုံး ၁ ခု ရှိရပါမည် — ဘောက်ချာအားလုံးကို ဖျက်လိုလျှင် ဖျက်မည်ကို နှိပ်ပါ',true);return}st.items.splice(Number(r.dataset.irm),1);ctl.setBody(draw())}
        if(pr){st.pays.splice(Number(pr.dataset.prm),1);ctl.setBody(draw())}
      });
      el.querySelector('#veSave').onclick=()=>{
        const c=calc();
        if(st.items.some(i=>!String(i.name||'').trim())){toast('ပစ္စည်းအမည် ထည့်ပါ');return}
        if(st.items.some(i=>Math.floor(num(i.qty))<=0)){toast('အရေအတွက် ထည့်ပါ');return}
        if(c.paid>c.total){toast('ပေးငွေသည် စုစုပေါင်းထက် များနေသည်',true);return}
        if(c.total-c.paid>0&&!st.cust){toast('ကြွေးကျန်သည့် ဘောက်ချာအတွက် ဖောက်သည် ရွေးပါ');return}
        unapplyVoucher(v0);
        const cust=st.cust?Store.get('customers',st.cust):null;
        const items=st.items.map(i=>Object.assign({},i,{name:String(i.name).trim(),price:Math.round(num(i.price)),qty:Math.floor(num(i.qty))}));
        items.forEach(i=>{const p=Store.get('products',i.pid);if(p)Store.put('products',Object.assign({},p,{stock:Math.max(0,(p.stock||0)-i.qty)}))});
        const pts=c.pv>0&&S.pointValue>0?Math.ceil(c.pv/S.pointValue):0,earned=cust&&S.earnPer>0?Math.floor(c.paid/S.earnPer):0;
        if(cust){const cf=Store.get('customers',cust.id);Store.put('customers',Object.assign({},cf,{points:Math.max(0,(cf.points||0)-pts+earned)}))}
        const pays=st.pays.filter(p=>Math.round(num(p.amount))>0).map(p=>Object.assign({},p,{amount:Math.round(num(p.amount))}));
        Store.put('vouchers',Object.assign({},v0,{date:Auth.owner()?(st.date||v0.date):v0.date,customerId:cust?cust.id:null,customerName:cust?cust.name:'',items:items,subtotal:c.sub,discount:c.disc,pointsUsed:pts,pointsValue:c.pv,total:c.total,paid:c.paid,payments:pays,pointsEarned:earned}));
        ctl.close();toast('ဘောက်ချာ ပြင်ပြီးပါပြီ');if(after)after();
      };
    }});
}
function customItemSheet(){

   body:'<div class="field"><label class="lbl" for="iN">ပစ္စည်းအမည် / အလုပ်အမျိုးအစား</label><input class="inp" id="iN" placeholder="ဥပမာ - DTF A3 ပုံနှိပ်"></div><div class="two"><div class="field"><label class="lbl" for="iP">ဈေးနှုန်း (ကျပ်)</label><input class="inp" id="iP" inputmode="numeric"></div><div class="field"><label class="lbl" for="iQ">အရေအတွက်</label><input class="inp" id="iQ" inputmode="numeric" value="1"></div></div><div class="field"><label class="lbl" for="iU">ယူနစ် (ရှိလျှင်)</label><input class="inp" id="iU"></div><div class="field"><label class="lbl"><input type="checkbox" id="iS"> ကုန်ပစ္စည်းစာရင်းထဲလည်း သိမ်းမည်</label></div>',
   footer:'<button class="btn pri block" id="iGo">ဇယားထဲ ထည့်မည်</button>',
   onMount(el){el.querySelector('#iGo').onclick=()=>{
     const g=x=>el.querySelector(x),n=g('#iN').value.trim(),pr=Math.max(0,Math.round(num(g('#iP').value))),q=Math.max(1,Math.floor(num(g('#iQ').value)||1)),u=g('#iU').value.trim();
     if(!n){toast('ပစ္စည်းအမည် ထည့်ပါ');return}
     if(g('#iS').checked){const id=uid('p');Store.put('products',{id:id,name:n,price:pr,stock:9999,unit:u,low:0,sku:'',createdAt:Date.now()});Cart.items.push({pid:id,qty:q})}
     else Cart.items.push({pid:uid('cu'),qty:q,custom:{name:n,price:pr,unit:u}});
     ctl.close();App.paint(false);toast('ဇယားထဲ ထည့်ပြီးပါပြီ');
   }}});
}
function checkoutSheet(){
  if(Sel.isClosed(today())){toast('ယနေ့ စာရင်းပိတ်ပြီးပါပြီ — ဘောက်ချာ ထပ်ဖြတ်၍ မရပါ');return}
  const lines=Cart.lines();if(!lines.length){toast('ပစ္စည်း အရင်ထည့်ပါ');return}
  const sub=Cart.subtotal(),S=Store.d.settings;
  const st={custId:Cart.customerId,mode:'paid'};
  Sheet.open({title:'ငွေရှင်းမည်',
    body:'<div class="field"><label class="lbl">ဖောက်သည်</label><div id="ckSel"></div>'
     +'<div class="search" style="margin-top:6px"><span aria-hidden="true">'+ico('search')+'</span><input class="inp" id="ckSearch" placeholder="အမည် သို့မဟုတ် ဖုန်းဖြင့် ရှာမည်"></div>'
     +'<div class="reslist" id="ckRes"></div>'
     +'<div class="rowf" style="margin-top:8px"><button type="button" class="btn s" id="ckNewBtn">'+ico('plus')+'ဖောက်သည်အသစ်</button></div>'
     +'<div id="ckNew" hidden style="margin-top:8px"><div class="two"><input class="inp" id="nName" placeholder="အမည်" aria-label="အမည်"><input class="inp" id="nPhone" inputmode="tel" placeholder="ဖုန်းနံပါတ်" aria-label="ဖုန်းနံပါတ်"></div><input class="inp" id="nAddr" placeholder="လိပ်စာ" aria-label="လိပ်စာ" style="margin-top:8px"><button type="button" class="btn pri s" id="nSave" style="margin-top:8px">ထည့်သွင်းမည်</button></div></div>'
     +'<div class="two"><div class="field"><label class="lbl" for="ckDisc">လျှော့စျေး (ကျပ်)</label><input class="inp" id="ckDisc" inputmode="numeric" placeholder="0"></div>'
     +'<div class="field" id="ckPtsBox" hidden><label class="lbl" for="ckPts">အသုံးပြုမည့် အမှတ်</label><input class="inp" id="ckPts" inputmode="numeric" placeholder="0"><button type="button" class="btn s" id="ckPtsAll" style="align-self:flex-start">အများဆုံးသုံးမည်</button></div></div>'
     +'<div class="field"><label class="lbl">ငွေပေးချေမှု</label>'+'<div class="seg" role="group"><button type="button" id="mPaid" aria-pressed="true">ငွေပေးပြီး</button><button type="button" id="mUnpaid" aria-pressed="false">ငွေမလွှဲရသေး</button></div></div>'
     +'<div class="field"><label class="lbl" for="ckRec" id="ckRecL">ယခုပေးငွေ</label><input class="inp" id="ckRec" inputmode="numeric"></div>'
     +'<div class="field" id="ckMF"><label class="lbl">ငွေပေးချေမှု နည်းလမ်း</label>'+methodPickerShell('ckM')+'</div>'
     +'<div class="sumbox" id="ckSum"></div>',
    footer:'<button class="btn pri block" id="ckGo">'+ico('check')+'ဘောက်ချာ ထုတ်မည်</button>',
    onMount(el,ctl){
      const q=s=>el.querySelector(s);
      const mp=methodPicker(el,'ckM',DEFAULT_METHOD);
      const calc=()=>{
        const cust=st.custId?Store.get('customers',st.custId):null;
        const disc=Math.min(Math.max(0,Math.round(num(q('#ckDisc').value))),sub);
        const maxPts=cust&&S.pointValue>0?Math.min(cust.points||0,Math.ceil((sub-disc)/S.pointValue)):0;
        const pts=Math.min(Math.max(0,Math.floor(num(q('#ckPts').value))),maxPts);
        const pv=Math.min(pts*S.pointValue,sub-disc),total=sub-disc-pv;
        const rec=st.mode==='paid'?total:Math.min(Math.max(0,Math.round(num(q('#ckRec').value))),total);
        const earn=cust&&S.earnPer>0?Math.floor(rec/S.earnPer):0;
        return {cust:cust,disc:disc,pts:pts,maxPts:maxPts,pv:pv,total:total,rec:rec,rem:total-rec,earn:earn};
      };
      const paintSum=()=>{
        const c=calc();
        q('#ckRec').disabled=false;
        q('#ckMF').hidden=!(c.rec>0);
        if(st.mode==='paid'&&document.activeElement!==q('#ckRec'))q('#ckRec').value=c.total;
        q('#ckRecL').textContent=st.mode==='paid'?'ပေးငွေ (လျော့ရိုက်လျှင် စရံငွေ ဖြစ်မည်)':'စရံငွေ (ရှိလျှင်)';
        q('#ckSum').innerHTML='<div class="ln"><span>ကုန်ပစ္စည်း စုစုပေါင်း</span><span>'+ks(sub)+'</span></div>'
          +(c.disc>0?'<div class="ln"><span>လျှော့စျေး</span><span>- '+ks(c.disc)+'</span></div>':'')
          +(c.pv>0?'<div class="ln"><span>အမှတ် '+ks(c.pts)+' မှတ်ဖြင့် နှုတ်ငွေ</span><span>- '+ks(c.pv)+'</span></div>':'')
          +'<div class="ln g"><span>ပေးရန် စုစုပေါင်း</span><span>'+ks(c.total)+' ကျပ်</span></div>'
          +'<div class="ln"><span>'+(c.rem>0?'စရံငွေ':'ပေးငွေ')+'</span><span>'+ks(c.rec)+'</span></div>'
          +'<div class="ln"><span>'+(c.rem>0?'ကြွေးသို့ ပေါင်းမည်':'ကျန်ငွေ')+'</span><span><b>'+ks(c.rem)+'</b></span></div>'
          +(c.cust?'<div class="ln"><span>ရရှိမည့် အမှတ်</span><span>+'+ks(c.earn)+' မှတ်</span></div>':'');
      };
      const paintCust=()=>{
        const cust=st.custId?Store.get('customers',st.custId):null;
        q('#ckSel').innerHTML=cust?'<div class="selchip"><div class="av" style="width:34px;height:34px">'+esc(initial(cust.name))+'</div><div class="mid"><div class="nm">'+esc(cust.name)+'</div><div class="sub">'+esc(cust.phone||'')+' · '+ks(cust.points||0)+' မှတ်'+(Sel.custDue(cust.id)>0?' · ကြွေး '+ks(Sel.custDue(cust.id)):'')+'</div></div><button type="button" class="icon-btn" id="ckClr" aria-label="ဖယ်ရှားမည်" style="width:34px;height:34px">'+ico('x')+'</button></div>':'<div class="selchip"><div class="mid">ဧည့်သည် (ဖောက်သည်မဟုတ်)</div></div>';
        const cl=q('#ckClr');if(cl)cl.onclick=()=>{st.custId=null;Cart.customerId=null;q('#ckPts').value='';paintCust();paintRes();paintSum()};
        q('#ckPtsBox').hidden=!(cust&&(cust.points||0)>0&&S.pointValue>0);
        if(q('#ckPtsBox').hidden)q('#ckPts').value='';
      };
      const paintRes=()=>{
        const term=q('#ckSearch').value.trim().toLowerCase();
        let list=Store.list('customers');
        if(term)list=list.filter(c=>(c.name||'').toLowerCase().includes(term)||(c.phone||'').replace(/\s/g,'').includes(term.replace(/\s/g,'')));
        else{const last={};Sel.vouchers().forEach(v=>{if(v.customerId&&!last[v.customerId])last[v.customerId]=v.createdAt});list=list.sort((a,b)=>(last[b.id]||0)-(last[a.id]||0))}
        list=list.filter(c=>c.id!==st.custId).slice(0,4);
        q('#ckRes').innerHTML=list.map(c=>'<button type="button" class="res" data-pick="'+c.id+'"><div class="av" style="width:32px;height:32px;font-size:13px">'+esc(initial(c.name))+'</div><div class="mid"><div class="nm">'+esc(c.name)+'</div><div class="sub">'+esc(c.phone||'')+'</div></div>'+(Sel.custDue(c.id)>0?'<span class="sub">ကြွေး '+ks(Sel.custDue(c.id))+'</span>':'')+'</button>').join('')||(term?'<div class="sub">မတွေ့ပါ — ဖောက်သည်အသစ် ထည့်နိုင်ပါသည်</div>':'');
      };
      el.addEventListener('click',e=>{const b=e.target.closest('[data-pick]');if(b){st.custId=b.dataset.pick;Cart.customerId=st.custId;q('#ckSearch').value='';paintCust();paintRes();paintSum()}});
      q('#ckSearch').addEventListener('input',paintRes);
      q('#ckNewBtn').onclick=()=>{const n=q('#ckNew');n.hidden=!n.hidden;if(!n.hidden)q('#nName').focus()};
      q('#nSave').onclick=()=>{const name=q('#nName').value.trim();if(!name){toast('အမည် ထည့်ပါ');return}const nc={id:uid('c'),name:name,phone:q('#nPhone').value.trim(),address:q('#nAddr').value.trim(),points:0,createdAt:Date.now()};Store.put('customers',nc);st.custId=nc.id;Cart.customerId=nc.id;q('#ckNew').hidden=true;q('#nName').value='';q('#nPhone').value='';q('#nAddr').value='';paintCust();paintRes();paintSum();toast('ဖောက်သည်အသစ် ထည့်ပြီးပါပြီ')};
      ['#ckDisc','#ckPts'].forEach(s=>q(s).addEventListener('input',paintSum));
      q('#ckRec').addEventListener('input',()=>{
        const raw=q('#ckRec').value.trim(),n=Math.round(num(raw)),t=calc().total;
        if(st.mode==='paid'){
          if(raw===''){paintSum();return}
          if(n<t){setMode('unpaid',true);return}
          if(n>t)q('#ckRec').value=t;
          paintSum();
        }else{
          if(raw!==''&&t>0&&n>=t){q('#ckRec').value=t;setMode('paid');return}
          paintSum();
        }
      });
      q('#ckRec').addEventListener('blur',paintSum);
      q('#ckPtsAll').onclick=()=>{const c=calc();q('#ckPts').value=c.maxPts;paintSum()};
      const setMode=(m,keep)=>{st.mode=m;q('#mPaid').setAttribute('aria-pressed',String(m==='paid'));q('#mUnpaid').setAttribute('aria-pressed',String(m==='unpaid'));if(m==='unpaid'&&!keep)q('#ckRec').value='';paintSum()};
      q('#mPaid').onclick=()=>setMode('paid');q('#mUnpaid').onclick=()=>setMode('unpaid');
      q('#ckGo').onclick=()=>{
        if(Sel.isClosed(today())){toast('ယနေ့ စာရင်းပိတ်ပြီးပါပြီ — ဘောက်ချာ ထပ်ဖြတ်၍ မရပါ');return}
        const c=calc();
        if(c.rem>0&&!st.custId){toast('ကြွေးရောင်းရန် ဖောက်သည် ရွေးပါ');return}
        const fresh=Cart.lines();
        for(const l of fresh){if(l.qty>l.p.stock){toast(l.p.name+' လက်ကျန် မလုံလောက်ပါ');return}}
        const v=createVoucher({lines:fresh,customerId:st.custId,discount:c.disc,pointsUsed:c.pts,received:c.rec,method:mp.get()});
        Cart.clear();ctl.close();App.render();updateCobar();
        toast('ဘောက်ချာ ထုတ်ပြီးပါပြီ');setTimeout(()=>voucherSheet(v.id),250);
      };
      paintCust();paintRes();setMode('paid');

const methodPickerShell=id=>'<div class="mpick" id="'+id+'"></div><div class="rowf" id="'+id+'New" hidden style="margin-top:8px;flex-wrap:nowrap"><input class="inp" id="'+id+'Inp" placeholder="ဥပမာ - AYA Pay, CB Pay, ဘဏ်လွှဲ" aria-label="ငွေပေးချေမှု နည်းလမ်းအသစ်" style="flex:1;min-width:0"><button type="button" class="btn pri s" id="'+id+'Ok">ထည့်မည်</button></div>';
function methodPicker(root,id,initial){
  const st={v:initial||DEFAULT_METHOD};
  const box=root.querySelector('#'+id),nw=root.querySelector('#'+id+'New'),inp=root.querySelector('#'+id+'Inp');
  const draw=()=>{
    const ms=Store.d.settings.methods||[DEFAULT_METHOD];
    if(ms.indexOf(st.v)<0)st.v=ms[0];
    box.innerHTML=ms.map(m=>'<button type="button" class="mchip" data-m="'+esc(m)+'" aria-pressed="'+(m===st.v)+'">'+esc(m)+'</button>').join('')+'<button type="button" class="mchip add" data-madd>'+ico('plus','s')+'အသစ်</button>';
  };
  box.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.hasAttribute('data-madd')){nw.hidden=!nw.hidden;if(!nw.hidden)inp.focus();return}
    st.v=b.dataset.m;draw();
  });
  const add=()=>{
    const n=inp.value.trim();if(!n)return;
    const S=Store.d.settings,ms=(S.methods||[DEFAULT_METHOD]).slice();
    if(ms.indexOf(n)<0){ms.push(n);Store.putSettings(Object.assign({},S,{methods:ms}))}
    st.v=n;inp.value='';nw.hidden=true;draw();toast('"'+n+'" ထည့်ပြီးပါပြီ');
  };
  root.querySelector('#'+id+'Ok').onclick=add;
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add()}});
  draw();
  return {get:()=>st.v};
}
function methodsUsed(v){const a=[];(v.payments||[]).forEach(p=>{const m=p.method||DEFAULT_METHOD;if(a.indexOf(m)<0)a.push(m)});return a.join(' / ')}

    pays.sort((a,b)=>b.p.at-a.p.at);
    const total=pays.reduce((a,x)=>a+x.p.amount,0),sales=Sel.salesOn(day);
    const left=Store.list('vouchers').filter(v=>v.date===day).reduce((a,v)=>a+Sel.rem(v),0);

     +'<div class="sub" style="margin-bottom:6px">ထိုနေ့ ဘောက်ချာများ၏ ကျန်ငွေ <b>'+ks(left)+'</b> ကျပ် · ငွေလက်ခံမှု <b>'+pays.length+'</b> ကြိမ်</div>'

     +'<div class="sec-t">ငွေလက်ခံမှု စာရင်း</div>'
     +(pays.length?'<div class="tbl-wrap"><table class="tbl"><thead><tr><th>အချိန်</th><th>ဖောက်သည် / ဘောက်ချာ</th><th>နည်းလမ်း</th><th class="r">ပမာဏ</th></tr></thead><tbody>'
       +pays.map(x=>'<tr data-act="open-voucher" data-id="'+x.v.id+'" tabindex="0"><td class="num">'+fmtT(x.p.at)+'</td><td><div class="nm">'+esc(Sel.cname(x.v))+'</div><div class="sub">#'+esc(x.v.no)+'</div>'+(x.v.date<day?'<div class="tag">ယခင်ဘောက်ချာ ကြွေးရှင်း</div>':'')+'</td><td><span class="mtag">'+esc(x.p.method||DEFAULT_METHOD)+'</span></td><td class="r"><b>'+ks(x.p.amount)+'</b></td></tr>').join('')

  };

function waPhone(ph){
  let d=String(ph||'').replace(/\D/g,'');
  if(d.indexOf('09')===0)d='95'+d.slice(1);
  return d.length>=8?d:'';
}
function shareText(v){
  const S=Store.d.settings,rem=Sel.rem(v),L=[];
  L.push(S.shopName);if(S.phone)L.push('ဖုန်း - '+S.phone);
  L.push('ဘောက်ချာ #'+v.no+' · '+fmtD(v.date));L.push('ဖောက်သည် - '+Sel.cname(v));if(v.byName)L.push('ဖြတ်သူ - '+v.byName);L.push('----------------');
  v.items.forEach(i=>L.push(i.name+' — '+ks(i.qty)+' × '+ks(i.price)+' = '+ks(i.price*i.qty)));
  L.push('----------------');
  if(v.discount>0)L.push('လျှော့စျေး - '+ks(v.discount));
  if(v.pointsValue>0)L.push('အမှတ်ဖြင့် နှုတ်ငွေ - '+ks(v.pointsValue));
  L.push('ပေးရန် စုစုပေါင်း - '+ks(v.total)+' ကျပ်');
  L.push(paidLbl(v)+' - '+ks(v.paid||0)+' ကျပ်');
  const m=methodsUsed(v);if(m)L.push('ငွေပေးချေမှု - '+m);
  L.push(rem>0?'အခြေအနေ - ငွေမလွှဲရသေး (ကျန်ငွေ '+ks(rem)+' ကျပ်)':'အခြေအနေ - ငွေပေးပြီး');
  if(S.footer)L.push(S.footer);
  return L.join('\n');
}

function copyText(text){
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();toast(ok?'စာသား ကူးပြီးပါပြီ':'ကူး၍ မရပါ')};
  try{navigator.clipboard.writeText(text).then(()=>toast('စာသား ကူးပြီးပါပြီ'),fallback)}catch(e){fallback()}
}
async function voucherBlob(v){
  try{await Promise.all([document.fonts.load('600 15px "Noto Sans Myanmar"'),document.fonts.load('700 15px "Plus Jakarta Sans"')])}catch(e){}
  const S=Store.d.settings,W=560,P=30,FONT='"Plus Jakarta Sans","Noto Sans Myanmar","Myanmar Text","Padauk",sans-serif';
  const sg=(typeof Intl!=='undefined'&&Intl.Segmenter)?new Intl.Segmenter('my',{granularity:'grapheme'}):null;
  const gr=s=>sg?Array.from(sg.segment(s),x=>x.segment):Array.from(s);
  const cv=document.createElement('canvas'),ctx=cv.getContext('2d');
  const rem=Sel.rem(v),meth=methodsUsed(v);
  let lg=null;if(S.logo){try{lg=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=S.logo})}catch(e){}}
  const run=dry=>{
    const font=(w,sz)=>{ctx.font=w+' '+sz+'px '+FONT};
    const wrap=(s,max,w,sz)=>{font(w,sz);const out=[];let ln='';gr(String(s)).forEach(g=>{if(ctx.measureText(ln+g).width>max&&ln){out.push(ln);ln=g}else ln+=g});if(ln)out.push(ln);return out.length?out:['']};
    const T=(s,x,yy,al,col,w,sz)=>{if(dry)return;font(w,sz);ctx.fillStyle=col;ctx.textAlign=al;ctx.fillText(s,x,yy)};
    const rule=yy=>{if(dry)return;ctx.fillStyle='#D5DBE8';ctx.fillRect(P,yy,W-2*P,1)};
    ctx.textBaseline='top';
    let y=0;
    const FM=S.fmt||{},fz=(k,b)=>Math.round(b*((FM[k]&&FM[k].s)||100)/100),fw=(k,d)=>{const x=FM[k]&&FM[k].b;return (x===undefined||x===null?d:x)?'700':'400'};
    const hn=(S.headerNote||'').split('\n').filter(Boolean),shS=fz('shop',24),ctS=fz('addr',13),nS=fz('note',13),ttS=fz('title',19),ftS=fz('foot',13);
    const lgS=lg?Math.min(140,Math.max(24,Math.round(((FM.logo&&FM.logo.h)||LOGO_H[S.logoSize]||22)*2.9))):0;
    const ctY=20+Math.round(shS*1.3)+4,nY=ctY+Math.round(ctS*1.5)+4,nSt=Math.round(nS*1.5);
    const HH=Math.max(96+hn.length*20,nY+hn.length*nSt+16,lgS+32),lx=lg?P+lgS+12:P;
    if(!dry){ctx.fillStyle='#0A192F';ctx.fillRect(0,0,W,HH);if(lg){ctx.fillStyle='#fff';ctx.fillRect(P,16,lgS,lgS);const k=Math.min((lgS-4)/lg.width,(lgS-4)/lg.height);ctx.drawImage(lg,P+lgS/2-lg.width*k/2,16+lgS/2-lg.height*k/2,lg.width*k,lg.height*k)}}
    T(S.shopName,lx,20,'left','#FFFFFF',fw('shop',1),shS);
    T([S.phone,S.address].filter(Boolean).join(' · '),lx,ctY,'left','rgba(255,255,255,.78)',fw('addr',0),ctS);
    hn.forEach((l,k)=>T(l,lx,nY+k*nSt,'left','rgba(255,255,255,.78)',fw('note',0),nS));
    y=HH+26;
    T((S.vTitle||'ဘောက်ချာ')+' #'+v.no,P,y,'left','#0A192F',fw('title',1),ttS);
    const st=rem>0?'ငွေမလွှဲရသေး':'ငွေပေးပြီး';
    font('700',13);const sw=ctx.measureText(st).width+24;
    if(!dry){ctx.beginPath();ctx.roundRect?ctx.roundRect(W-P-sw,y-1,sw,28,14):ctx.rect(W-P-sw,y-1,sw,28);if(rem>0){ctx.fillStyle='#B91C1C';ctx.fill()}else{ctx.lineWidth=1.5;ctx.strokeStyle='#0A192F';ctx.stroke()}}
    T(st,W-P-sw/2,y+3,'center',rem>0?'#FFFFFF':'#0A192F','700',13);
    y+=Math.max(36,Math.round(ttS*1.5));
    T(fmtD(v.date)+' · '+fmtT(v.createdAt)+(v.byName?' · ဖြတ်သူ '+v.byName:''),P,y,'left','#5B6B86','400',14);y+=24;
    wrap('ဖောက်သည် - '+Sel.cname(v),W-2*P,'600',15).forEach(l=>{T(l,P,y,'left','#0A192F','600',15);y+=24});
    y+=6;rule(y);y+=8;
    T('ပစ္စည်း',P,y,'left','#5B6B86','600',12);T('အရေအတွက်',W-P-120,y,'right','#5B6B86','600',12);T('ကျသင့်ငွေ',W-P,y,'right','#5B6B86','600',12);
    y+=24;rule(y);y+=10;
    v.items.forEach(i=>{
      const nl=wrap(i.name,W-2*P-230,'600',15);
      nl.forEach((l,k)=>{T(l,P,y+k*23,'left','#0A192F','600',15)});
      T(ks(i.qty)+(i.unit?' '+i.unit:''),W-P-120,y,'right','#0A192F','400',15);
      T(ks(i.price*i.qty),W-P,y,'right','#0A192F','700',15);
      y+=nl.length*23;
      T(ks(i.price)+' ကျပ်',P,y,'left','#5B6B86','400',12);
      y+=24;
    });
    rule(y);y+=12;
    const row=(a,b,bold)=>{T(a,P,y,'left','#0A192F',bold?'700':'400',bold?18:15);T(b,W-P,y,'right','#0A192F',bold?'800':'600',bold?18:15);y+=bold?32:26};
    row('ကုန်ပစ္စည်း စုစုပေါင်း',ks(v.subtotal));

    row('ပေးရန် စုစုပေါင်း',ks(v.total)+' ကျပ်',true);
    row(paidLbl(v),ks(v.paid||0));
    row('ကျန်ငွေ',ks(rem));
    if(meth)row('ငွေပေးချေမှု',meth);
    y+=10;
    const fa=(FM.foot&&FM.foot.a)||'center',fx=fa==='left'?P:fa==='right'?W-P:W/2;
    (S.footer||'').split('\n').forEach(f=>wrap(f,W-2*P,fw('foot',0),ftS).forEach(l=>{T(l,fx,y,fa,'#5B6B86',fw('foot',0),ftS);y+=Math.round(ftS*1.7)}));
    return y+28;
  };
  const H=Math.ceil(run(true));
  const sc=2;cv.width=W*sc;cv.height=H*sc;
  ctx.setTransform(sc,0,0,sc,0,0);ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,W,H);

}
async function saveVoucherImage(v){
  if(!Store.dl){toast('ဤနေရာတွင် ပုံသိမ်း၍ မရပါ — စာသား ကူးယူ၍ ပို့ပါ');return}
  toast('ပုံ ပြင်ဆင်နေသည်...');
  try{
    const blob=await voucherBlob(v);if(!blob)throw new Error('blob');
    await Store.dl.save({filename:'voucher-'+v.no+'.png',data:blob});
    toast('ပုံသိမ်းပြီးပါပြီ — Viber၊ Messenger စသည်ဖြင့် ပို့နိုင်ပါပြီ');
  }catch(e){if(e&&e.code==='declined')return;toast('ပုံသိမ်း၍ မရပါ')}
}

function clearDemo(){

function rangeOf(r,f,t2){const t=today(),m=t.slice(0,8)+'01';
  if(r==='today')return[t,t];if(r==='yday'){const y=addDays(t,-1);return[y,y]}if(r==='7')return[addDays(t,-6),t];
  if(r==='month')return[m,t];if(r==='lmonth'){const e=addDays(m,-1);return[e.slice(0,8)+'01',e]}
  if(r==='custom')return[f||'',t2||''];return['','']}
function vFilt(){
  let list=Sel.vouchers();
  if(F.vStatus==='paid')list=list.filter(v=>Sel.rem(v)<=0);
  if(F.vStatus==='unpaid')list=list.filter(v=>Sel.rem(v)>0);
  const r=rangeFor('v');list=list.filter(v=>(!r[0]||v.date>=r[0])&&(!r[1]||v.date<=r[1]));
  if(F.vMethod)list=list.filter(v=>(v.payments||[]).some(p=>(p.method||DEFAULT_METHOD)===F.vMethod));
  if(F.vBy)list=list.filter(v=>v.by===F.vBy);
  if(F.vCust)list=list.filter(v=>v.customerId===F.vCust);
  const term=F.vQuery.trim().toLowerCase();
  if(term)list=list.filter(v=>{const c=v.customerId?Store.get('customers',v.customerId):null;return v.no.toLowerCase().includes(term)||Sel.cname(v).toLowerCase().includes(term)||(c&&(c.phone||'').replace(/\s/g,'').includes(term.replace(/\s/g,'')))});
  return list;
}

function stockInSheet(){
  const ps=Store.list('products').sort((a,b)=>String(a.name).localeCompare(String(b.name)));
  if(!ps.length){toast('ကုန်ပစ္စည်း အရင်ထည့်ပါ');return}
  const rows=[{pid:ps[0].id,qty:'',cost:ps[0].cost!=null?ps[0].cost:''}];
  const ctl=Sheet.open({title:'ပစ္စည်းအဝင်',
    body:'<p class="sub" style="margin-bottom:8px">ထည့်သွင်းထားသော ကုန်ပစ္စည်းများထဲမှ ရွေးပါ။ သိမ်းလိုက်လျှင် လက်ကျန်ထဲ တိုးပြီး ကုန်ကျစရိတ်ထဲလည်း ဝင်သွားပါမည်။</p><div id="siRows"></div><button type="button" class="btn s" id="siAdd">'+ico('plus')+'ပစ္စည်း ထပ်ထည့်မည်</button>'
     +'<div class="field" style="margin-top:12px"><label class="lbl" for="siDate">ရက်စွဲ</label><input class="inp" id="siDate" type="date" max="'+today()+'" value="'+today()+'"'+(Auth.owner()?'':' disabled')+'></div>'
     +'<div class="field"><label class="lbl">ငွေပေးချေမှု နည်းလမ်း</label>'+methodPickerShell('siM')+'</div>'
     +'<div class="sumbox"><div class="ln"><span>စုစုပေါင်း ဝယ်ယူငွေ</span><span id="siTot">0 ကျပ်</span></div></div>',
    footer:'<button class="btn pri block" id="siSave">သိမ်းမည်</button>',
    onMount(el,c){
      const q=x=>el.querySelector(x),mp=methodPicker(el,'siM',DEFAULT_METHOD);
      const tot=()=>rows.reduce((a,r)=>a+Math.round(num(r.cost))*Math.floor(num(r.qty)),0);
      const upd=()=>{q('#siTot').textContent=ks(tot())+' ကျပ်'};
      const draw=()=>{
        q('#siRows').innerHTML=rows.map((r,i)=>'<div class="card" style="padding:10px;margin-bottom:8px"><div class="field"><label class="lbl" for="siP'+i+'">ကုန်ပစ္စည်း</label><select class="inp" id="siP'+i+'" data-i="'+i+'">'+ps.map(p=>'<option value="'+p.id+'"'+(p.id===r.pid?' selected':'')+'>'+esc(p.name)+' (လက်ကျန် '+ks(p.stock)+')</option>').join('')+'</select></div>'
         +'<div class="two"><div class="field"><label class="lbl" for="siQ'+i+'">အရေအတွက်</label><input class="inp" id="siQ'+i+'" data-i="'+i+'" data-k="qty" inputmode="numeric" value="'+esc(r.qty)+'"></div><div class="field"><label class="lbl" for="siC'+i+'">ဝယ်ဈေး (တစ်ခုလျှင်)</label><input class="inp" id="siC'+i+'" data-i="'+i+'" data-k="cost" inputmode="numeric" value="'+esc(r.cost)+'"></div></div>'
         +(rows.length>1?'<button type="button" class="btn s out" data-rm="'+i+'">'+ico('trash')+'ဖယ်ရှားမည်</button>':'')+'</div>').join('');
        upd();
      };
      draw();
      q('#siRows').addEventListener('input',e=>{const t=e.target,i=t.dataset.i;if(i==null||!t.dataset.k)return;rows[i][t.dataset.k]=t.value;upd()});
      q('#siRows').addEventListener('change',e=>{const t=e.target;if(t.tagName==='SELECT'){const i=Number(t.dataset.i),p=Store.get('products',t.value);rows[i].pid=t.value;rows[i].cost=p&&p.cost!=null?p.cost:'';draw()}});
      q('#siRows').addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(b){rows.splice(Number(b.dataset.rm),1);draw()}});
      q('#siAdd').onclick=()=>{rows.push({pid:ps[0].id,qty:'',cost:ps[0].cost!=null?ps[0].cost:''});draw()};
      q('#siSave').onclick=()=>{
        const items=[];
        for(const r of rows){
          const qty=Math.floor(num(r.qty)),cost=Math.round(num(r.cost)),p=Store.get('products',r.pid);
          if(!p)continue;
          if(!(qty>0)){toast('အရေအတွက် ထည့်ပါ ('+p.name+')');return}
          if(!(cost>=0)||r.cost===''){toast('ဝယ်ဈေး ထည့်ပါ ('+p.name+')');return}
          items.push({pid:p.id,name:p.name,unit:p.unit||'',qty:qty,cost:cost});
        }
        if(!items.length)return;
        const amount=items.reduce((a,i)=>a+i.qty*i.cost,0),me=Auth.me||{},d=Auth.owner()?(q('#siDate').value||today()):today();

const Auth={me:null,plat:null,
  async hash(pw,salt){const enc=new TextEncoder(),k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);const b=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:enc.encode(salt),iterations:60000},k,256);return Array.from(new Uint8Array(b),x=>pad(x.toString(16))).join('')},
  find(u){u=String(u).trim().toLowerCase();return Store.list('accounts').find(a=>a.username===u)},
  async make(name,user,pw,role){const salt=uid('s');return {id:uid('u'),name:name,username:user.trim().toLowerCase(),role:role,salt:salt,hash:await this.hash(pw,salt),active:true,createdAt:Date.now()}},

  },

  restore(){let id=null;try{id=localStorage.getItem(SK)}catch(e){}const a=id==='trial'?{id:'trial',name:'စမ်းသုံး',username:'trial',role:'owner',trial:true}:id==='trial-c'?{id:'trial-c',name:'စမ်းသုံး',username:'trial',role:'accountant',trial:true}:id&&Store.get('accounts',id);if(a&&a.active!==false){this.me=a;return true}return false},

function chipEd(box,arr,minKeep){
  let ei=-1;const orig={};
  const draw=()=>{
    box.innerHTML=arr.map((m,i)=>i===ei
      ?'<span class="mchip fixed"><input class="inp" data-ein value="'+esc(m)+'" aria-label="အမည်" style="min-height:30px;padding:0 8px;width:130px"><button type="button" class="x-btn" data-eok="'+i+'" aria-label="အတည်ပြုမည်">'+ico('check','s')+'</button></span>'
      :'<span class="mchip fixed">'+esc(m)+'<button type="button" class="x-btn" data-eed="'+i+'" aria-label="ပြင်မည်">'+ico('edit','s')+'</button>'+(arr.length>minKeep?'<button type="button" class="x-btn" data-mrm="'+i+'" aria-label="ဖယ်ရှားမည်">'+ico('x','s')+'</button>':'')+'</span>').join('');
    const inp=box.querySelector('[data-ein]');if(inp){inp.focus();if(inp.select)inp.select()}
  };
  const commit=()=>{
    const inp=box.querySelector('[data-ein]');if(!inp){ei=-1;return}
    const n=inp.value.trim(),cur=arr[ei];
    if(n&&n!==cur&&arr.indexOf(n)<0){const o=orig[cur]||cur;delete orig[cur];orig[n]=o;arr[ei]=n}
    ei=-1;draw();
  };
  box.addEventListener('click',e=>{
    const rm=e.target.closest('[data-mrm]'),ed=e.target.closest('[data-eed]'),ok=e.target.closest('[data-eok]');
    if(rm){arr.splice(Number(rm.dataset.mrm),1);ei=-1;draw()}
    else if(ed){ei=Number(ed.dataset.eed);draw()}
    else if(ok)commit();
  });
  box.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-ein]')){e.preventDefault();commit()}});
  return {draw:draw,orig:orig};
}

const DCOL=['#1E3A8A','#0EA5A4','#F59E0B','#E11D48','#7C3AED','#64748B'];
function smoothPath(pts,lo,hi){
  const cl=y=>lo==null?y:Math.min(hi,Math.max(lo,y));
  if(pts.length<2)return '';
  let d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2,k=.18;
    d+=' C'+(p1[0]+(p2[0]-p0[0])*k).toFixed(1)+' '+cl(p1[1]+(p2[1]-p0[1])*k).toFixed(1)+' '+(p2[0]-(p3[0]-p1[0])*k).toFixed(1)+' '+cl(p2[1]-(p3[1]-p1[1])*k).toFixed(1)+' '+p2[0].toFixed(1)+' '+p2[1].toFixed(1);
  }
  return d;
}
function curveChart(days,series){
  const W=340,H=170,L=34,R=8,T=10,B=22,iw=W-L-R,ih=H-T-B,n=days.length;
  const mx=Math.max(1,...series.map(s=>Math.max(...s.v)));
  const nice=(()=>{const m=Math.pow(10,Math.floor(Math.log10(mx)));const f=mx/m;return (f<=1?1:f<=2?2:f<=5?5:10)*m})();
  const X=i=>L+(n>1?i/(n-1)*iw:iw/2),Y=v=>T+ih-v/nice*ih;
  const short=v=>v>=1e6?(v/1e6)+'M':v>=1e3?(v/1e3)+'k':String(v);
  let g='';
  for(let i=0;i<=4;i++){const y=T+ih-i/4*ih;g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="currentColor" stroke-opacity=".10"/><text x="'+(L-5)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="9.5" fill="currentColor" fill-opacity=".55">'+short(nice*i/4)+'</text>'}
  const step=Math.max(1,Math.ceil(n/6));
  for(let i=0;i<n;i+=(days[0][0]==='h'?4:step)){const lb=days[i][0]==='h'?days[i].slice(1)+':00':(()=>{const p=days[i].split('-');return Number(p[2])+'/'+Number(p[1])})();g+='<text x="'+X(i)+'" y="'+(H-6)+'" text-anchor="middle" font-size="9.5" fill="currentColor" fill-opacity=".55">'+lb+'</text>'}

function donut(items,centerTop,centerSub){

function dashCharts(vs,cutoff,t,sales,paidSum,hourly){
  let from=cutoff;

  if(from<addDays(t,-89))from=addDays(t,-89);
  const H24=hourly?Array.from({length:24},(_,i)=>i):null;
  const days=[];for(let d=from;d<=t;d=addDays(d,1))days.push(d);
  if(!hourly&&days.length<2)days.unshift(addDays(days[0],-1));
  const base=hourly?H24:days,sv=base.map(()=>0),cv=base.map(()=>0),ev=base.map(()=>0),ix={};days.forEach((d,i)=>ix[d]=i);
  const hr=ts=>{const h=new Date(ts||Date.now()).getHours();return h};
  if(hourly){vs.forEach(v=>{if(v.date===t){const h=hr(v.createdAt);sv[h]+=v.total;cv[h]+=(v.paid||0)}});Store.list('expenses').forEach(e=>{if(e.date===t)ev[hr(e.createdAt)]+=e.amount})}
  else{vs.forEach(v=>{if(ix[v.date]!=null){sv[ix[v.date]]+=v.total;cv[ix[v.date]]+=(v.paid||0)}});
  Store.list('expenses').forEach(e=>{if(ix[e.date]!=null)ev[ix[e.date]]+=e.amount})}
  const mt={};vs.forEach(v=>(v.payments||[]).forEach(p=>{const m=p.method||DEFAULT_METHOD;mt[m]=(mt[m]||0)+p.amount}));
  const mItems=Object.keys(mt).sort((a,b)=>mt[b]-mt[a]).map((k,i)=>({n:k,v:mt[k],c:DCOL[i%DCOL.length]}));
  const pm={};vs.forEach(v=>v.items.forEach(i=>{pm[i.name]=(pm[i.name]||0)+i.price*i.qty}));
  let pk=Object.keys(pm).sort((a,b)=>pm[b]-pm[a]);const pItems=pk.slice(0,4).map((k,i)=>({n:k,v:pm[k],c:DCOL[i]}));
  const rest=pk.slice(4).reduce((a,k)=>a+pm[k],0);if(rest>0)pItems.push({n:'အခြား',v:rest,c:DCOL[5]});
  const cat={};Store.list('expenses').filter(e=>(!cutoff||e.date>=cutoff)&&e.date<=t).forEach(e=>{const k=e.category||'အခြား';cat[k]=(cat[k]||0)+e.amount});
  let ck=Object.keys(cat).sort((a,b)=>cat[b]-cat[a]);const eItems=ck.slice(0,4).map((k,i)=>({n:k,v:cat[k],c:DCOL[i]}));
  const er=ck.slice(4).reduce((a,k)=>a+cat[k],0);if(er>0)eItems.push({n:'အခြား',v:er,c:DCOL[5]});
  const due=Math.max(0,sales-paidSum),pct=sales>0?Math.round(paidSum/sales*100):0;
  const card=(h,b)=>'<section class="card"><div class="card-h"><h3>'+h+'</h3></div>'+b+'</section>';
  return card('ရောင်းရငွေ လမ်းကြောင်း','<div class="sub" style="margin-bottom:4px">ကျပ် · '+(hourly?'နာရီအလိုက်':'နေ့စဉ်')+'</div>'+curveChart(hourly?H24.map(h=>'h'+h):days,[{n:'ရောင်းရငွေ',v:sv,c:DCOL[0],area:1},{n:'ရရှိငွေ',v:cv,c:DCOL[1]},{n:'ကုန်ကျ',v:ev,c:DCOL[3]}]))
   +card('ရရှိငွေ / ကြွေး အချိုး',donut([{n:'ရရှိပြီး',v:paidSum,c:DCOL[1]},{n:'ကြွေးကျန်',v:due,c:DCOL[3]}],pct+'%','ရရှိပြီး'))
   +card('ငွေပေးချေမှု နည်းလမ်း',donut(mItems,ks(mItems.reduce((a,x)=>a+x.v,0)),'ကျပ်'))
   +card('ပစ္စည်းအလိုက် ရောင်းရငွေ',donut(pItems,String(pk.length),'မျိုး'))
   +card('ကုန်ကျစရိတ် အမျိုးအစား',donut(eItems,ks(eItems.reduce((a,x)=>a+x.v,0)),'ကျပ်'));
}

function profitOf(vs){
  let rev=0,cogs=0,miss={};
  vs.forEach(v=>{rev+=v.total;(v.items||[]).forEach(i=>{let c=i.cost;if(c==null){const pr=Store.get('products',i.pid);c=pr&&pr.cost!=null?pr.cost:null}if(c==null)miss[i.name]=1;else cogs+=c*i.qty})});
  return {rev:rev,cogs:cogs,missing:Object.keys(miss).length};
}

  window.addEventListener('resize',()=>{if(App.tab==='sell'&&$('#cartBox'))$('#cartBox').innerHTML=cartHTML()});
})();
})();
</script>
