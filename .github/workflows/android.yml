name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install npm packages
        run: npm install —no-audit —no-fund

      - name: Bundle Supabase library + fonts (offline copy)
        run: npm run vendor

      - name: Create / update Android project
        run: node scripts/android-setup.js

      - name: Sync web files into Android
        run: npx cap sync android

      - name: Accept Android SDK licenses
        run: yes | “$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager” —licenses > /dev/null || true

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug —no-daemon —stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shop-pos-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
