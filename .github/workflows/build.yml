name: Build Android APK

# repo ထဲ: index.html (root) + .github/workflows/build.yml
# Actions tab › "Build Android APK" › Run workflow → Artifacts ထဲက POS-APK ကို ဒေါင်းပါ

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['index.html', 'vendor/**', '.github/workflows/build.yml']

env:
  # ⚠ ရှိပြီးသား app ကို အစားထိုးချင်ရင် အရင် APK ရဲ့ package name နဲ့ အတူတူ ထားရပါမယ်
  APP_ID: com.viewdigital.shoppos
  APP_NAME: "ဆိုင် POS"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # signing key တူအောင်ထားရန် (APK အသစ်ကို အဟောင်းပေါ် update သွင်းလို့ရအောင်)
      - name: Restore signing key cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Use saved signing key (optional secret DEBUG_KEYSTORE_BASE64)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > ~/.android/debug.keystore; fi

      - name: Prepare web files
        run: |
          mkdir -p _build/www/vendor
          cp index.html _build/www/index.html
          [ -d vendor ] && cp -r vendor/. _build/www/vendor/ || true
          [ -d icons ] && cp -r icons _build/www/icons || true
          # Supabase library ကို APK ထဲ ထည့်ပေးမယ် (index.html က vendor/supabase.min.js ကို အရင်ရှာတယ်)
          if [ ! -s _build/www/vendor/supabase.min.js ]; then
            curl -fsSL "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" -o _build/www/vendor/supabase.min.js
          fi

      - name: Create Capacitor Android project
        working-directory: _build
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/app@6
          npx cap init "$APP_NAME" "$APP_ID" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Add Bluetooth printer + native print plugins
        working-directory: _build
        run: |
          PLUG=android/app/src/main/java/com/shoppos/plugins
          JAVA_DIR=android/app/src/main/java/$(echo "$APP_ID" | tr . /)
          mkdir -p "$PLUG" "$JAVA_DIR"

          cat > "$PLUG/BtPrinterPlugin.java" <<'EOF'
          package com.shoppos.plugins;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothManager;
          import android.bluetooth.BluetoothSocket;
          import android.content.Context;
          import android.os.Build;
          import android.util.Base64;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;
          import java.io.OutputStream;
          import java.util.HashMap;
          import java.util.Map;
          import java.util.UUID;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          @CapacitorPlugin(name = "BtPrinter", permissions = {
              @Permission(alias = "bt", strings = { Manifest.permission.BLUETOOTH_CONNECT })
          })
          public class BtPrinterPlugin extends Plugin {
            private static final UUID SPP = UUID.fromString("00001101-0000-1000-8000-00805F9B34FB");
            /* printer အများကြီး တစ်ပြိုင်နက် ချိတ်ထားနိုင်သည် */
            private final Map<String, BluetoothSocket> socks = new HashMap<>();
            private final ExecutorService io = Executors.newSingleThreadExecutor();

            private boolean needPerm() {
              return Build.VERSION.SDK_INT >= 31 && getPermissionState("bt") != PermissionState.GRANTED;
            }

            private BluetoothAdapter adapter() {
              BluetoothManager m = (BluetoothManager) getContext().getSystemService(Context.BLUETOOTH_SERVICE);
              return m == null ? null : m.getAdapter();
            }

            @PluginMethod
            public void list(PluginCall call) {
              if (needPerm()) { requestPermissionForAlias("bt", call, "listPerm"); return; }
              doList(call);
            }

            @PermissionCallback
            private void listPerm(PluginCall call) {
              if (needPerm()) { call.reject("Bluetooth ခွင့်ပြုချက် မရသေးပါ — Nearby devices ကို Allow လုပ်ပါ"); return; }
              doList(call);
            }

            @SuppressLint("MissingPermission")
            private void doList(PluginCall call) {
              try {
                BluetoothAdapter a = adapter();
                if (a == null) { call.reject("ဤစက်တွင် Bluetooth မရှိပါ"); return; }
                if (!a.isEnabled()) { call.reject("Bluetooth ပိတ်ထားသည် — ဖွင့်ပါ"); return; }
                JSArray arr = new JSArray();
                for (BluetoothDevice d : a.getBondedDevices()) {
                  JSObject o = new JSObject();
                  o.put("name", d.getName() == null ? d.getAddress() : d.getName());
                  o.put("address", d.getAddress());
                  arr.put(o);
                }
                JSObject r = new JSObject();
                r.put("devices", arr);
                call.resolve(r);
              } catch (Exception e) {
                call.reject("Bluetooth list failed: " + e.getMessage());
              }
            }

            @PluginMethod
            public void connect(PluginCall call) {
              if (needPerm()) { requestPermissionForAlias("bt", call, "connectPerm"); return; }
              doConnect(call);
            }

            @PermissionCallback
            private void connectPerm(PluginCall call) {
              if (needPerm()) { call.reject("Bluetooth ခွင့်ပြုချက် မရသေးပါ — Nearby devices ကို Allow လုပ်ပါ"); return; }
              doConnect(call);
            }

            private void doConnect(final PluginCall call) {
              final String addr = call.getString("address");
              if (addr == null) { call.reject("address လိုအပ်သည်"); return; }
              io.execute(() -> {
                try {
                  open(addr);
                  call.resolve();
                } catch (Exception e) {
                  call.reject("Bluetooth connect failed: " + e.getMessage());
                }
              });
            }

            @SuppressLint("MissingPermission")
            private synchronized BluetoothSocket open(String addr) throws Exception {
              BluetoothSocket old = socks.get(addr);
              if (old != null) {
                if (old.isConnected()) return old;
                try { old.close(); } catch (Exception ignore) {}
                socks.remove(addr);
              }
              BluetoothAdapter a = adapter();
              if (a == null) throw new Exception("Bluetooth မရှိပါ");
              BluetoothDevice d = a.getRemoteDevice(addr);
              BluetoothSocket s = null;
              try {
                s = d.createRfcommSocketToServiceRecord(SPP);
                s.connect();
              } catch (Exception first) {
                try { if (s != null) s.close(); } catch (Exception ignore) {}
                s = d.createInsecureRfcommSocketToServiceRecord(SPP);
                s.connect();
              }
              socks.put(addr, s);
              return s;
            }

            @PluginMethod
            public void write(final PluginCall call) {
              final String addr = call.getString("address");
              final String data = call.getString("data");
              if (addr == null || data == null) { call.reject("address / data လိုအပ်သည်"); return; }
              io.execute(() -> {
                try {
                  BluetoothSocket s = open(addr);
                  OutputStream os = s.getOutputStream();
                  os.write(Base64.decode(data, Base64.DEFAULT));
                  os.flush();
                  call.resolve();
                } catch (Exception e) {
                  closeOne(addr);
                  call.reject("Bluetooth write failed: " + e.getMessage());
                }
              });
            }

            @PluginMethod
            public void disconnect(PluginCall call) {
              String addr = call.getString("address");
              if (addr != null) closeOne(addr);
              call.resolve();
            }

            private synchronized void closeOne(String addr) {
              BluetoothSocket s = socks.remove(addr);
              if (s != null) { try { s.close(); } catch (Exception ignore) {} }
            }

            @Override
            protected void handleOnDestroy() {
              for (String k : new java.util.ArrayList<>(socks.keySet())) closeOne(k);
            }
          }
          EOF

          cat > "$PLUG/NativePrintPlugin.java" <<'EOF'
          package com.shoppos.plugins;

          import android.app.Activity;
          import android.content.Context;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "NativePrint")
          public class NativePrintPlugin extends Plugin {
            private WebView keep;

            @PluginMethod
            public void print(final PluginCall call) {
              final String html = call.getString("html");
              if (html == null) { call.reject("html လိုအပ်သည်"); return; }
              final String name = call.getString("name", "print");
              final String size = call.getString("size", "a4");
              final double wmm = call.getDouble("wmm", 80.0);
              final double hmm = call.getDouble("hmm", 200.0);
              final Activity act = getActivity();
              act.runOnUiThread(() -> {
                try {
                  final WebView wv = new WebView(act);
                  keep = wv;
                  final boolean[] done = { false };
                  wv.setWebViewClient(new WebViewClient() {
                    @Override
                    public void onPageFinished(WebView v, String url) {
                      if (done[0]) return;
                      done[0] = true;
                      try {
                        PrintManager pm = (PrintManager) act.getSystemService(Context.PRINT_SERVICE);
                        PrintDocumentAdapter ad = v.createPrintDocumentAdapter(name);
                        PrintAttributes.MediaSize ms;
                        if ("th".equals(size)) {
                          ms = new PrintAttributes.MediaSize("th80", "80mm", 3150, 11000);
                        } else if ("custom".equals(size)) {
                          ms = new PrintAttributes.MediaSize("custom", "custom",
                              (int) Math.round(wmm / 25.4 * 1000), (int) Math.round(hmm / 25.4 * 1000));
                        } else {
                          ms = PrintAttributes.MediaSize.ISO_A4;
                        }
                        PrintAttributes at = new PrintAttributes.Builder()
                            .setMediaSize(ms)
                            .setMinMargins(PrintAttributes.Margins.NO_MARGINS)
                            .build();
                        pm.print(name, ad, at);
                        call.resolve();
                      } catch (Exception e) {
                        call.reject("print failed: " + e.getMessage());
                      }
                    }
                  });
                  wv.loadDataWithBaseURL(null, html, "text/html", "UTF-8", null);
                } catch (Exception e) {
                  call.reject("print failed: " + e.getMessage());
                }
              });
            }
          }
          EOF

          cat > "$JAVA_DIR/MainActivity.java" <<EOF
          package ${APP_ID};

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          import com.shoppos.plugins.BtPrinterPlugin;
          import com.shoppos.plugins.NativePrintPlugin;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(BtPrinterPlugin.class);
              registerPlugin(NativePrintPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          EOF

      - name: Add Android permissions
        working-directory: _build
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          add = '''
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-feature android:name="android.hardware.bluetooth" android:required="false" />
          '''
          if 'BLUETOOTH_CONNECT' not in s:
              s = s.replace('</manifest>', add + '</manifest>')
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Build APK
        working-directory: _build/android
        run: |
          VC=$(( $(date +%s) / 60 ))
          sed -i -E "s/versionCode [0-9]+/versionCode ${VC}/" app/build.gradle
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: POS-APK
          path: _build/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
